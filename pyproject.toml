[project]
name = "crate-digger"
version = "0.1.0"
description = "Index monthly SoundCloud mixtapes and their tracklists."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "django>=4.2,<6",
    "playwright>=1.56.0",
]

[project.scripts]
crate-digger = "crate_digger.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
